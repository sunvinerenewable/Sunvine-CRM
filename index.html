    </script>

    <!-- Local & Authoritative Typography Preconnections & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />

    <style>
      /* Local Material Symbols Outlined font to prevent ligature fallback flash */
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-style: normal;
        font-weight: 100 700;
        font-display: block;
        src: url('/fonts/material-symbols-outlined.woff2') format('woff2');
      }

      /* Local Typography Fallback Definitions */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: local('Space Grotesk'), url('/fonts/space-grotesk-latin.woff2') format('woff2');
      }

      @font-face {
        font-family: 'Space_Grotesk';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: local('Space Grotesk'), url('/fonts/space-grotesk-latin.woff2') format('woff2');
      }

      /* Critical baseline styling to guarantee zero raw HTML or FOUC */
      html, body {
        background-color: #F7F9FF;
        color: #181C20;
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: clip;
      }
      #root {
        min-height: 100vh;
        background-color: #F7F9FF;
      }

      /* Mask ligature text completely while font is rendering */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined' !important;
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        font-feature-settings: 'liga';
        text-rendering: optimizeLegibility;
        overflow: hidden;
        width: 1em;
        height: 1em;
        flex-shrink: 0;
        user-select: none;
      }

      /* Lightweight Branded Initial App Shell */
      .app-boot-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        background-color: #0F1B2E;
        color: #FFFFFF;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .app-boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: pulseShell 1.8s ease-in-out infinite;
      }
      .app-boot-logo {
        width: 220px;
        height: auto;
        max-width: 85vw;
        object-fit: contain;
      }
      .app-boot-subtitle {
        font-size: 13px;
        color: #A1F96F;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 600;
        margin: 0;
      }
      @keyframes pulseShell {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.85; }
      }
    </style>
  </head>
  <body class="bg-[#F7F9FF] text-[#181C20] font-sans antialiased selection:bg-[#6CBF3D] selection:text-white">
    <div id="root">
      <!-- Branded App Shell visible instantly before JavaScript hydration -->
      <div class="app-boot-shell">
        <div class="app-boot-brand">
          <img
            src="/sunvine_logo_white.png"
            alt="Sunvine Renewable Energy"
            class="app-boot-logo"
            width="220"
            height="52"
            onerror="this.src='/sunvine-logo.png'"
          />
          <div style="text-align: center;">
            <p class="app-boot-subtitle">Solar EPC Operations Platform</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
