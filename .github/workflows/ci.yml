name: CI Build & Verification Gate

on:
  push:
    branches:
      - main
      - development
      - dev
  pull_request:
    branches:
      - main
      - development

jobs:
  build-and-verify:
    name: Verify Build & Test Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Solar Engine Unit Tests
        run: npm test

      - name: Compile Production Build
        run: npm run build

