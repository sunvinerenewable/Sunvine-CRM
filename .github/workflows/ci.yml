name: CI Build & Verification Gate

on:
  push:
    branches:
      - main
      - sumit-updates
      - devlopment
      - development
      - dev
      - 'fix/*'
  pull_request:
    branches:
      - main
      - sumit-updates
      - devlopment
      - development

jobs:
  build-and-verify:
    name: Verify Build & Test Integrity
    runs-on: ubuntu-latest
    # ✅ This job does NOT block Vercel — Vercel deploys independently.
    # CI runs in parallel with the Vercel deployment, not before it.
    # To enforce CI as a Vercel deploy gate, add a "Required checks" rule
    # in Vercel Dashboard → Project → Settings → Git → Required checks.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@707a04944d8cb84589d90d8102d84950269ec3b7 # v2.3.8

      - name: Setup Node.js 20.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Solar Engine Unit Tests
        run: npm test

      - name: Compile Production Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEOAPIFY_API_KEY: ${{ secrets.VITE_GEOAPIFY_API_KEY }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
        run: npm run build
